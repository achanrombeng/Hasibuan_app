<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="25%" stop-color="#e02424"/>
      <stop offset="70%" stop-color="#c81e1e"/>
      <stop offset="100%" stop-color="#8f1111"/>
    </radialGradient>
    <ellipse id="shadow" cx="32" cy="58" rx="20" ry="3.5" fill="#444444" opacity="0.25"/>
  </defs>

  <!-- Shadow under sphere -->
